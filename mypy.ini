# Static type checking for our own SE layer.
#
# The pydantic plugin is what makes this useful: without it mypy does not
# know that pydantic-settings populates Settings' fields from the
# environment, and reports the `Settings()` call in src/config.py as
# missing three required arguments.
#
# follow_imports = silent scopes the check to src/. The provided ai/
# package reports errors of its own, caused by mismatches between the
# vendor SDK stubs and the adapters written against them; §4.8 of the
# brief forbids us from editing that package, so those are out of scope
# here and are discussed in the report instead.
#
# Run with: mypy src/
[mypy]
plugins = pydantic.mypy
ignore_missing_imports = True
follow_imports = silent
